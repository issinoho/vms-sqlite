# Upstream SQLite release this port is built from.
UPSTREAM_NAME=sqlite
UPSTREAM_VERSION=3.54.1
# The amalgamation with its configure script: sqlite3.c, sqlite3.h, sqlite3ext.h, shell.c.
UPSTREAM_URL=https://sqlite.org/2026/sqlite-autoconf-3540100.tar.gz
# SQLite does not sign its releases; sqlite.org's download page publishes SHA3-256
# hashes (D1), so that is what we pin.
UPSTREAM_SHA3=b6ced585c750916b1052667239a12c25a7ff34e7f06e1e6e01ecb0427657d9c4
# The full source tree, for the test programs only (mptest, threadtest, speedtest1).
TESTSRC_URL=https://sqlite.org/2026/sqlite-src-3540100.zip
TESTSRC_SHA3=877c6f4996ce7adb368686bce21638de9e3d91534832ad3d9d119037d1bc22ad
# Our patch level on top of the upstream release (3.54.1-vms1)
VMS_PATCH_LEVEL=1
KIT_PRODUCER=ISSINOHO
KIT_PRODUCT=VMSSQLITE
